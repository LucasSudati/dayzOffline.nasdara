name: DayZ Discord Sync
on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync README table to one Discord message
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          from pathlib import Path
          url = os.environ.get("DISCORD_WEBHOOK_URL", "").rstrip("/")
          if not url:
              raise SystemExit("Missing DISCORD_WEBHOOK_URL")
          lines = Path("README.md").read_text(encoding="utf-8").splitlines()
          rows = []
          for line in lines:
              if not line.startswith("|") or line.startswith("|---") or line.startswith("| Categoria"):
                  continue
              cells = [x.strip() for x in line.strip("|").split("|")]
              if len(cells) >= 5:
                  rows.append(cells[:5])
          # Discord does not render Markdown tables; use aligned code blocks.
          def short(s, n):
              return s.replace("**", "").replace("`", "'").replace("\n", " ")[:n]
          pages = []
          header = "ITEM                         | RESUMO\n" + "-" * 65 + "\n"
          page = header
          for category, item, question, answer, source in rows:
              summary = short(answer, 100)
              entry = f"{short(item, 28):28} | {summary}\n"
              if len(page) + len(entry) > 1600:
                  pages.append(page)
                  page = header
              page += entry
          pages.append(page)
          embeds = [{"title": "DayZ Nasdara | Tabela de consultas" + (f" ({i+1}/{len(pages)})" if len(pages)>1 else ""),
                     "description": "```text\n" + p + "```",
                     "url": "https://github.com/LucasSudati/dayzOffline.nasdara/blob/main/README.md"}
                    for i, p in enumerate(pages)]
          # Keep the message ID in a repository file; GITHUB_TOKEN can write contents.
          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          state_api = f"{api}/repos/{repo}/contents/.github/discord-table-message-id.txt"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          def request(endpoint, method="GET", body=None, headers=None):
              data = None if body is None else json.dumps(body).encode()
              h = dict(headers or {})
              if data is not None: h["Content-Type"] = "application/json"
              return urllib.request.urlopen(urllib.request.Request(endpoint, data=data, headers=h, method=method), timeout=20)
          message_id, state_sha = None, None
          try:
              with request(state_api, headers=headers) as response:
                  state = json.load(response)
                  message_id = base64.b64decode(state["content"]).decode().strip()
                  state_sha = state["sha"]
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  print(f'GitHub state read failed: HTTP {e.code}: {e.read().decode(errors="replace")[:500]}')
                  raise
          payload = {"content": "📚 **Consultas DayZ Nasdara — tabela atualizada**", "embeds": embeds[:10], "allowed_mentions": {"parse": []}}
          if message_id:
              try:
                  with request(url + "/messages/" + message_id, "PATCH", payload):
                      print("Updated Discord table:", message_id)
                      raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      print(f'Discord message update failed: HTTP {e.code}: {e.read().decode(errors="replace")[:500]}')
                      raise
          with request(url + "?wait=true", "POST", payload) as response:
              message_id = str(json.load(response)["id"])
          state_body = {"message": "Save Discord table message ID", "content": base64.b64encode(message_id.encode()).decode()}
          if state_sha: state_body["sha"] = state_sha
          with request(state_api, "PUT", state_body, headers):
              pass
          print("Created Discord table:", message_id)
          PY
